workflows:
  android-apk-build:
    name: Build Android APK Jam 7 Pagi
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Re-create Flutter project structure
        script: |
          cd ..
          flutter create --org com.example temp_app
          cp -r temp_app/android clone/
          cp -r temp_app/ios clone/
          cp -r temp_app/web clone/
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK with Flutter
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
