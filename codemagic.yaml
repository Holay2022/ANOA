workflows:
  android-apk-build:
    name: Build Android APK Jam 7 Pagi
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Recreate clean Flutter Android setup
        script: |
          flutter create . --org com.example --project-name app_pengingat --platforms=android --overwrite
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK with Flutter
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
